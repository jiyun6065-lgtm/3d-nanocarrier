<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NanoCarrier 3D: Dungeon LAB Escape</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div class="hud">
        <div>지질막 내구도: <span id="hp" style="color: #4ade80;">100%</span></div>
        <div>수집한 코드: <span id="code-display" style="color: #fbbf24; font-size: 16px;">[ _ ] [ _ ] [ _ ]</span></div>
    </div>

    <div id="interact-prompt" onclick="triggerNearbyInteraction()">[ 상호작용 ]</div>

    <!-- 고정 조이스틱 레이어 -->
    <div id="joystick-wrapper">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay-screen">
        <h1 style="color:#fbbf24;">세포 연구소 던전 탈출</h1>
        <p>각 방에 숨겨진 3개의 암호 상자 문제를 맞춰 코드를 모으고<br>중앙 2층 게이트로 탈출하세요!</p>
        <button id="start-btn" class="start-btn">DUNGEON START</button>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="modal">
        <h2 id="quiz-title">암호 상자 발견!</h2>
        <p id="quiz-question"></p>
        <div id="quiz-options"></div>
        <button onclick="closeModal('quiz-modal')" class="start-btn" style="padding: 8px 20px; font-size: 14px; background: #64748b; margin-top: 10px;">닫기</button>
    </div>

    <!-- 게이트 모달 -->
    <div id="gate-modal" class="modal">
        <h2>표적 수용체 게이트</h2>
        <p>수집한 3자리 암호 코드를 입력하세요!</p>
        <input type="text" id="gate-input" maxlength="3" style="font-size: 24px; width: 120px; text-align: center; letter-spacing: 5px; padding: 5px; margin-bottom: 15px; color: black;">
        <br>
        <button onclick="submitGateCode()" class="start-btn" style="padding: 8px 20px; font-size: 16px;">탈출 시도</button>
        <button onclick="closeModal('gate-modal')" class="start-btn" style="padding: 8px 20px; font-size: 16px; background: #64748b; margin-left: 10px;">닫기</button>
    </div>

    <div id="message-text"></div>

    <script src="game.js"></script>
</body>
</html>

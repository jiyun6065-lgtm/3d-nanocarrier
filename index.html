<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NanoCarrier 3D: Dungeon LAB Escape</title>
    
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="crosshair"></div>

    <!-- 상단 HUD -->
    <div class="hud">
        <div>지질막 내구도: <span id="hp" style="color: #38bdf8;">100%</span></div>
        <div id="quest-info" style="font-size: 12px; color: #94a3b8; margin-top: 4px;">
            목표: 중앙 홀의 분해 효소를 피해 2층 [표적 수용체]에 도달하세요
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay-screen">
        <h1 style="color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.7);">던전 세트장 세포 탈출</h1>
        <p>푸른 횃불이 켜진 세포 내 미로에 진입했습니다.<br>중앙 홀을 빠르게 배회하는 <strong>분해 효소</strong>를 피해 2층 테라스의 <strong>표적 수용체</strong>에 도달하세요!</p>
        <div class="guide-box">
            <strong>W A S D</strong> : 이동 &nbsp;|&nbsp; <strong>마우스</strong> : 시점 회전 &nbsp;|&nbsp; <strong>푸른 캡슐</strong> : 내구도 +25%
        </div>
        <button id="start-btn" class="start-btn" type="button">DUNGEON START</button>
    </div>

    <div id="message-text"></div>

    <!-- 자바스크립트 파일 연결 (ES Module) -->
    <script type="module" src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NanoCarrier 3D: Dungeon LAB Escape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div class="hud">
        <div>지질막 내구도: <span id="hp" style="color: #4ade80;">100%</span></div>
        <div>수집한 코드: <span id="code-display" style="color: #fbbf24; font-size: 16px;">[ _ ] [ _ ] [ _ ]</span></div>
    </div>

    <div id="interact-prompt" onclick="triggerNearbyInteraction()">[ 상호작용 ]</div>

    <div id="joystick-wrapper">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay-screen">
        <div class="mist-bg"></div>
        
        <!-- 세포 연구소 던전 실루엣 & 나노캐리어 아트워크 배경 -->
        <svg class="theme-backdrop" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="coreGlow" cx="50%" cy="46%" r="38%">
                    <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
                    <stop offset="55%" stop-color="#0f766e" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="#040709" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0c171d" stop-opacity="0.9"/>
                    <stop offset="100%" stop-color="#040709" stop-opacity="1"/>
                </linearGradient>
            </defs>

            <rect width="1600" height="900" fill="url(#coreGlow)"/>

            <!-- 원경 던전 석조 아치 & 기둥 실루엣 -->
            <path d="M 0,900 L 0,120 L 240,120 L 240,900 Z" fill="url(#archGrad)"/>
            <path d="M 1360,900 L 1360,120 L 1600,120 L 1600,900 Z" fill="url(#archGrad)"/>
            <path d="M 240,260 Q 800,40 1360,260 L 1360,0 L 240,0 Z" fill="#050a0d" opacity="0.92"/>
            
            <!-- 좌우 중경 던전 기둥 -->
            <rect x="330" y="180" width="75" height="720" fill="#070e12" opacity="0.85"/>
            <rect x="1195" y="180" width="75" height="720" fill="#070e12" opacity="0.85"/>

            <!-- 중앙 제단 & 표적 수용체 링 실루엣 -->
            <polygon points="620,900 670,740 930,740 980,900" fill="#070f13"/>
            <rect x="700" y="690" width="200" height="50" fill="#091318"/>
            
            <!-- 표적 수용체 게이트 & 나노캐리어 이중막 궤도 -->
            <circle cx="800" cy="430" r="165" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="14 10" opacity="0.28"/>
            <circle cx="800" cy="430" r="135" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.22"/>
            <circle cx="800" cy="430" r="95" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.2"/>
            
            <!-- 수용체 결합 돌기 (Y자형 리간드 실루엣) -->
            <g stroke="#2dd4bf" stroke-width="2.5" opacity="0.3" fill="none">
                <line x1="800" y1="265" x2="800" y2="235"/><polyline points="785,220 800,235 815,220"/>
                <line x1="800" y1="595" x2="800" y2="625"/><polyline points="785,640 800,625 815,640"/>
                <line x1="635" y1="430" x2="605" y2="430"/><polyline points="590,415 605,430 590,445"/>
                <line x1="965" y1="430" x2="995" y2="430"/><polyline points="1010,415 995,430 1010,445"/>
            </g>

            <!-- 부유하는 세포/나노 입자들 -->
            <g fill="#2dd4bf" opacity="0.45">
                <circle cx="480" cy="310" r="4"/>
                <circle cx="520" cy="540" r="3"/>
                <circle cx="1110" cy="290" r="4.5"/>
                <circle cx="1060" cy="560" r="3"/>
                <circle cx="670" cy="240" r="2.5"/>
                <circle cx="940" cy="250" r="3"/>
            </g>

            <!-- 바닥 석조 타일 원근선 -->
            <g stroke="#1e293b" stroke-width="1.5" opacity="0.55">
                <line x1="0" y1="810" x2="1600" y2="810"/>
                <line x1="0" y1="855" x2="1600" y2="855"/>
                <line x1="550" y1="740" x2="250" y2="900"/>
                <line x1="1050" y1="740" x2="1350" y2="900"/>
                <line x1="800" y1="740" x2="800" y2="900"/>
            </g>
        </svg>

        <div class="mist-fog fog-1"></div>
        <div class="spores-left"></div>
        <div class="spores-right"></div>
        <div class="vignette"></div>

        <!-- 화면 중앙을 가로지르는 타이틀 로고 -->
        <div class="center-hero-group">
            <div class="title-sub">DUNGEON LAB ESCAPE</div>
            <h1 class="rune-title">NANOCARRIER</h1>
        </div>

        <!-- 타이틀 아래 심플한 텍스트형 START 버튼 영역 -->
        <div class="clean-action-area">
            <button id="start-btn" class="clean-start-btn">START GAME</button>
            <button type="button" class="clean-sub-btn" onclick="toggleGuideModal(true)">MISSION BRIEFING</button>
        </div>

        <!-- 임무 브리핑 팝업 -->
        <div id="briefing-box" class="briefing-panel" style="display: none;">
            <h3>[ 세포 연구소 던전 탈출 수칙 ]</h3>
            <p>1. 중앙 홀을 배회하는 <strong>분해 효소(리소좀)</strong>를 피해 3개의 방을 탐색하세요.</p>
            <p>2. 각 방의 보물상자 퀴즈를 풀어 <strong>3자리 암호 코드</strong>를 수집하세요.</p>
            <p>3. 2층 테라스의 <strong>표적 수용체 게이트</strong>에 암호를 입력해 탈출하세요.</p>
            <button type="button" class="rpg-close-btn" onclick="toggleGuideModal(false)">CLOSE</button>
        </div>

        <div class="bottom-brand">CELLULAR LAB EDITION</div>
        <div class="version-tag">v1.0.4</div>
    </div>

    <div id="quiz-modal" class="modal">
        <h2 id="quiz-title">암호 상자 발견!</h2>
        <p id="quiz-question"></p>
        <div id="quiz-options"></div>
        <button onclick="closeModal('quiz-modal')" class="start-btn" style="padding: 8px 20px; font-size: 14px; background: #64748b; margin-top: 10px;">닫기</button>
    </div>

    <div id="gate-modal" class="modal">
        <h2>표적 수용체 게이트</h2>
        <p>수집한 3자리 암호 코드를 입력하세요!</p>
        <input type="text" id="gate-input" maxlength="3" style="font-size: 24px; width: 120px; text-align: center; letter-spacing: 5px; padding: 5px; margin-bottom: 15px; color: black;">
        <br>
        <button onclick="submitGateCode()" class="start-btn" style="padding: 8px 20px; font-size: 16px;">탈출 시도</button>
        <button onclick="closeModal('gate-modal')" class="start-btn" style="padding: 8px 20px; font-size: 16px; background: #64748b; margin-left: 10px;">닫기</button>
    </div>

    <div id="message-text"></div>

    <script>
        function toggleGuideModal(show) {
            const box = document.getElementById('briefing-box');
            if (box) box.style.display = show ? 'block' : 'none';
        }
    </script>
    <script src="game.js"></script>
</body>
</html>
